version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.6.0

[package]
name = "subetha-core"
version = "0.1.0"
description = "SubEtha core SDK: envelope, canonical JSON, signatures, E2EE, dedupe, store-and-forward, routing, edge transports"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "subetha_core"
# `lib` for Rust users and tests. `cdylib` (Android .so, JVM via JNA, desktop) and `staticlib`
# (iOS XCFramework) are what the UniFFI bindings load. Without the `uniffi` feature they
# export nothing and only cost an extra link step.
crate-type = ["lib", "cdylib", "staticlib"]

# UniFFI's bindgen CLI (`uniffi::uniffi_bindgen_main()`), used by scripts/gen-bindings.sh:
#   cargo run -p subetha-core --features bindgen --bin uniffi-bindgen -- generate ...
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
# Montgomery arithmetic for wrapped topic keys (spec §5.1); already a dependency of ed25519-dalek.
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
getrandom = "0.2"
sha2 = "0.10"
thiserror = "1"
uniffi = { version = "0.28", optional = true }

[features]
default = []
# Export the `ffi` module through UniFFI proc-macros (see BINDINGS.md).
uniffi = ["dep:uniffi"]
# `uniffi` plus the bindgen CLI (the `uniffi-bindgen` binary). Kept apart from `uniffi` so
# library builds for phones don't compile the generator (clap, askama, goblin, ...).
bindgen = ["uniffi", "uniffi/cli"]

# Docs sample (docs/samples/rust); `cargo test` builds it, so a broken sample fails CI.
[[example]]
name = "sign_and_encrypt"
path = "../../docs/samples/rust/sign_and_encrypt.rs"

[package]
name = "subetha-core"
version = "0.1.0"
description = "SubEtha core SDK: envelope, canonical JSON, signatures, E2EE, dedupe, store-and-forward, routing, edge transports"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "subetha_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
getrandom = "0.2"
thiserror = "1"
uniffi = { version = "0.28", optional = true }

[features]
default = []
# Export the `ffi` module through UniFFI proc-macros (see BINDINGS.md).
uniffi = ["dep:uniffi"]

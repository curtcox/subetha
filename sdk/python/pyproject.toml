[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "subetha"
version = "0.1.0"
description = "Python SDK for SubEtha, a transport-agnostic, ntfy-compatible pub/sub relay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://subetha.org"
Source = "https://github.com/curtcox/subetha"

[tool.hatch.build.targets.wheel]
packages = ["src/subetha"]

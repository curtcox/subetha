# uniffi-bindgen-react-native config (scaffold; not built in CI yet, see README.md).
# Generates the @subetha/react-native-core Turbo Module from sdk/core's UniFFI surface:
#   npx uniffi-bindgen-react-native build android --and-generate
#   npx uniffi-bindgen-react-native build ios --and-generate
# ubrn supports uniffi 0.28 (the version sdk/core pins).
name: SubEthaCore
rust:
  directory: ../core
  manifestPath: Cargo.toml
android:
  directory: ./android
  cargoExtras: ["--features", "uniffi"]
  targets: [arm64-v8a, armeabi-v7a, x86_64]
ios:
  directory: ./ios
  cargoExtras: ["--features", "uniffi"]
  targets: [aarch64-apple-ios, aarch64-apple-ios-sim]
bindings:
  cpp: cpp/generated
  ts: src/generated
turboModule:
  name: NativeSubEthaCore
  spec: src/NativeSubEthaCore.ts

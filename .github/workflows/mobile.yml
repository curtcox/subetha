name: Mobile SDKs

# Rust core bindings (UniFFI), Kotlin, Swift, Dart/Flutter and React Native SDKs, and the
# sample apps (PLAN §10, §14 tracks E/F).

on:
  push:
    paths:
      - "sdk/core/**"
      - "sdk/kotlin/**"
      - "sdk/swift/**"
      - "sdk/flutter/**"
      - "sdk/react-native/**"
      - "sdk/js/**"
      - "spec/vectors/**"
      - "samples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "sdk/core/**"
      - "sdk/kotlin/**"
      - "sdk/swift/**"
      - "sdk/flutter/**"
      - "sdk/react-native/**"
      - "sdk/js/**"
      - "spec/vectors/**"
      - "samples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bindings:
    name: Rust core + UniFFI bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features subetha-core/uniffi
      - run: cargo clippy --workspace --all-targets --features subetha-core/uniffi -- -D warnings
      - run: cargo clippy --workspace --all-targets --features subetha-core/bindgen -- -D warnings
      - name: Committed Kotlin/Swift bindings match the Rust code
        run: sdk/core/scripts/gen-bindings.sh --check

  kotlin:
    name: Kotlin (JVM) SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build libsubetha_core for the JNA tests
        run: cargo build -p subetha-core --features uniffi --lib
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle -p sdk/kotlin test --no-daemon
      - name: Core tests ran (not skipped)
        run: |
          grep -q 'skipped="0"' sdk/kotlin/subetha-core/build/test-results/test/TEST-org.subetha.core.CoreTest.xml
          grep -q 'skipped="0"' sdk/kotlin/subetha-core/build/test-results/test/TEST-org.subetha.core.EdgeLinksTest.xml

  swift:
    name: Swift SDK (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the core XCFramework (host macOS slice)
        run: sdk/swift/scripts/build-xcframework.sh --macos-only --debug
      - name: swift test (SubEthaTests + SubEthaCoreTests)
        run: swift test --package-path sdk/swift
      - name: Full XCFramework (iOS device + simulator + macOS)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sdk/swift/scripts/build-xcframework.sh --zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: subetha_coreFFI.xcframework
          path: sdk/swift/build/subetha_coreFFI.xcframework.zip

  dart:
    name: Dart SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  react-native:
    name: React Native package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @subetha/react-native typecheck
      - run: pnpm --filter @subetha/react-native test

  android-sample:
    name: Android sample (assembleDebug)
    runs-on: ubuntu-latest
    # Scaffold: report failures without blocking SDK changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); setup-android's sdkmanager
      # trips over preview-licence prompts, so it isn't used.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build libsubetha_core.so for the Edge tab
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t x86_64 -o samples/android/app/src/main/jniLibs build -p subetha-core --features uniffi --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle -p samples/android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: doorbell-debug.apk
          path: samples/android/app/build/outputs/apk/debug/app-debug.apk

  flutter-sample:
    name: Flutter sample (analyze)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: samples/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Info-level lints (e.g. new framework deprecations) shouldn't fail the build.
      - run: flutter analyze --no-fatal-infos

  staging-flow:
    name: Scripted flow against staging (optional, needs secrets)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SUBETHA_URL: ${{ vars.SUBETHA_STAGING_URL }}
      SUBETHA_TOKEN: ${{ secrets.SUBETHA_STAGING_TOKEN }}
      TOPIC: ${{ vars.SUBETHA_STAGING_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip without staging credentials
        id: creds
        run: |
          if [ -z "$SUBETHA_TOKEN" ] || [ -z "$SUBETHA_URL" ]; then
            echo "SUBETHA_STAGING_TOKEN / SUBETHA_STAGING_URL not configured; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        run: samples/cli/doorbell-curl.sh "${TOPIC:-@ci/doorbell}"
      - if: steps.creds.outputs.ok == 'true'
        run: node samples/agent-mcp/call-mcp.mjs "${TOPIC:-@ci/doorbell}"

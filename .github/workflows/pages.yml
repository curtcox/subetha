name: Pages

# GitHub Pages (PLAN §13): docs, build info (commit, CI badges, test counts, SDK versions), the
# pricing invariant report, sample apps (the web sample, the Expo web build, Android APKs), and
# links to the live console and SDK packages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the Android sample APKs attached to Mobile SDKs runs
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # PLAN open question 2: curtcox.github.io/subetha, or a custom domain such as dev.subetha.us.
  # For a custom domain set the repository variables PAGES_BASE_PATH=/ and PAGES_URL=https://dev.subetha.us.
  PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/subetha/' }}
  PAGES_URL: ${{ vars.PAGES_URL || 'https://curtcox.github.io/subetha' }}
  APP_URL: ${{ vars.APP_URL || 'https://subetha.us' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile

      # Test counts for the build-info page. Failures are reported there (and by ci.yml); they
      # don't block publishing the docs.
      - name: Tests (TypeScript)
        continue-on-error: true
        run: |
          mkdir -p test-results
          for pkg in spec pricing sdk/js workers/api docs/samples apps/site gateways/apns-relay; do
            name=$(echo "$pkg" | tr / -)
            pnpm --dir "$pkg" exec vitest run --reporter=default --reporter=json \
              --outputFile.json="$GITHUB_WORKSPACE/test-results/ts-$name.json" || true
          done
      - name: Tests (Rust)
        continue-on-error: true
        run: cargo test --workspace 2>&1 | tee test-results/rust.txt
      - name: Tests (Python)
        continue-on-error: true
        run: |
          pip install -e "sdk/python[test]" -e "gateways/reticulum[test]"
          pytest sdk/python gateways/reticulum --junitxml=test-results/python.xml

      # Sample apps (PLAN §13). Neither step blocks publishing; the samples page falls back to
      # build instructions for anything missing.
      - name: Expo web build of the React Native sample
        continue-on-error: true
        working-directory: samples/react-native
        env:
          EXPO_BASE_URL: ${{ env.PAGES_BASE_PATH }}samples/expo
        run: |
          npm install --no-audit --no-fund
          npx expo export --platform web --output-dir "$GITHUB_WORKSPACE/sample-builds/expo"
      - name: Latest Android sample APKs (artifacts of Mobile SDKs runs on main)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sample-builds/android
          for name in doorbell-debug.apk doorbell-expo-debug-x86_64.apk; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=20" \
              --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")][0].id // empty')
            if [ -z "$id" ]; then echo "no $name artifact"; continue; fi
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$name.zip"
            unzip -o -j "$RUNNER_TEMP/$name.zip" '*.apk' -d "$RUNNER_TEMP/$name.d"
            mv "$RUNNER_TEMP/$name.d/"*.apk "sample-builds/android/$name"
          done
          ls -l sample-builds/android

      - run: pnpm --filter @subetha/sdk build
      - name: Build the site
        run: >
          node apps/site/build.mjs --pages --out site-build
          --base "$PAGES_BASE_PATH" --site-url "$PAGES_URL" --app-url "$APP_URL"
          --test-results test-results --samples sample-builds
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
